function shopScreen(){let filter=S.shopFilter||'All';let order=S.sort||'Recommended';let list=H.furniture.filter(f=>filter==='All'||filter==='Budget'&&f.price<=250||filter==='Standard'&&f.price>250&&f.price<=1000||filter==='Premium'&&f.price>1000||H.styles.includes(filter)&&f.styles.includes(filter)||catNames.includes(filter)&&(H.roleMap[f.type]||f.type)===filter);if(order==='Cheapest')list.sort((a,b)=>a.price-b.price);if(order==='Most Expensive')list.sort((a,b)=>b.price-a.price);if(order==='Quality')list.sort((a,b)=>b.quality-a.quality);if(order==='Trending')list.sort((a,b)=>(b.styles.includes(S.market.trend)?1:0)-(a.styles.includes(S.market.trend)?1:0));return `<div class="page"><div class="topline"><div><div class="eyebrow">CURATED FOR LIVED-IN BEAUTY · ${H.furniture.length} PIECES</div><h1 class="page-title">Furniture Shop</h1><p class="page-lede">A mix of considered basics and investment pieces. Choose well, spend thoughtfully.</p></div><button class="btn" data-screen="${S.showShopFrom==='editor'?'editor':'house'}">← Back</button></div><div class="trend-strip"><div><span>THIS WEEK'S FURNITURE TREND</span><br><strong>${S.market.trend}</strong><span> · matching items resell for 20% more</span></div><button class="btn soft" data-screen="market">Market notes</button></div><div style="display:flex;gap:8px;align-items:center;margin:0 0 13px;flex-wrap:wrap"><select class="filter-select" style="width:165px;margin:0" id="shopFilter"><option>All</option><option>Budget</option><option>Standard</option><option>Premium</option>${catNames.map(c=>`<option>${c}</option>`).join('')}${H.styles.map(c=>`<option>${c}</option>`).join('')}</select><select class="filter-select" style="width:145px;margin:0" id="shopSort"><option>Recommended</option><option>Cheapest</option><option>Most Expensive</option><option>Quality</option><option>Trending</option></select><span style="font-size:9px;color:#898a80">Owned furniture is yours to use in any compatible room.</span></div><div class="shop-grid">${list.map(f=>`<article class="furniture-card"><div class="furniture-art" style="--item:${f.color}"><span class="mini-swatch"></span><span class="tag" style="position:absolute;right:8px;top:8px;background:#fffdf0cc;padding:4px">${f.price<=250?'BUDGET':f.price<=1000?'STANDARD':'PREMIUM'}</span></div><div class="furniture-card-body"><div class="tag">${(H.roleMap[f.type]||f.type).toUpperCase()} · ${f.styles[0].toUpperCase()}</div><h3>${f.name}</h3><p>Quality ${f.quality}/5 · Comfort ${f.comfort}/5 · Beauty ${f.beauty}/5<br>Resale ${money(currentResale(f))} · ${f.quality>4?'Designer rarity':'Level '+f.level+' unlock'}</p><div class="furniture-card-bottom"><span class="price">${money(f.price)}</span>${f.level>S.level?`<button class="btn" disabled>Level ${f.level}</button>`:`<button class="btn ${H.ownCount(f.id)?'soft':'primary'}" data-buy="${f.id}">${H.ownCount(f.id)?`Owned ×${H.ownCount(f.id)} · Buy another`:'Add to inventory'}</button>`}</div></div></article>`).join('')}</div></div>`}
function contractsScreen(){return `<div class="page"><div class="topline"><div><div class="eyebrow">CLIENT STUDIO · ${clientTier(S.rep).toUpperCase()}</div><h1 class="page-title">Design contracts</h1><p class="page-lede">Every brief is a chance to grow your reputation. Review the budget, scope and client before you commit.</p></div><button class="btn" data-screen="house">← My House</button></div><div class="contract-grid">${H.contracts.map(c=>{let locked=S.rep<(c.repReq||0);return `<article class="contract-card"><div style="display:flex;justify-content:space-between"><span class="tag">${c.tier} · ${c.room.toUpperCase()}</span><span class="tag">${c.repReq?`REP ${c.repReq}+`:'OPEN'}</span></div><h3>${c.project}</h3><div class="tag">CLIENT · ${c.client.toUpperCase()}</div><p>${c.brief}</p><div class="contract-meta"><span>PROJECT BUDGET<b>${money(c.budget)}</b></span><span>BASE PAYMENT<b>${money(c.pay)}</b></span><span>90+ BONUS<b>${money(c.bonus)}</b></span></div><p><b>Looking for:</b> ${c.needs.join(' · ')}<br><b>Preferred style:</b> ${c.style} · <b>Reputation:</b> +${c.rep}</p><button class="btn ${locked?'':'primary'}" ${locked?'disabled':''} data-accept="${c.id}">${locked?`Requires ${c.repReq} reputation`:'Review & accept brief →'}</button></article>`}).join('')}</div><div class="inline-note">Your client payment responds to satisfaction and budget management. A strong brief match can be more valuable than buying the most expensive pieces.</div></div>`}
function inventoryScreen(){let entries=H.furniture.filter(f=>H.ownCount(f.id)>0);let filter=S.invFilter||'All';if(filter!=='All')entries=entries.filter(f=>(H.roleMap[f.type]||f.type)===filter||f.styles.includes(filter));return `<div class="page"><div class="topline"><div><div class="eyebrow">YOUR PERSONAL COLLECTION · ${Object.values(S.inventory).reduce((a,b)=>a+b,0)} PIECES</div><h1 class="page-title">Furniture inventory</h1><p class="page-lede">Your pieces are permanent assets. Use them across compatible rooms or sell them when a fresh start makes sense.</p></div><button class="btn" data-screen="house">← My House</button></div><select class="filter-select" style="width:180px" id="invFilter"><option>All</option>${catNames.map(c=>`<option>${c}</option>`)}${H.styles.map(c=>`<option>${c}</option>`).join('')}</select><div class="shop-grid">${entries.map(f=>`<article class="furniture-card"><div class="furniture-art" style="--item:${f.color}"><span class="mini-swatch"></span></div><div class="furniture-card-body"><div class="tag">${H.roleMap[f.type]||f.type} · ${f.styles[0]}</div><h3>${f.name} <span class="qty">×${H.ownCount(f.id)}</span></h3><p>Purchased ${money(f.price)}<br>Current resale ${money(currentResale(f))}</p><div class="furniture-card-bottom"><button class="btn soft" data-sell="${f.id}">Sell one · ${money(currentResale(f))}</button></div></div></article>`).join('')||'<div class="empty-state">Your collection is waiting for its first piece.</div>'}</div></div>`}
function challengeScreen(){let complete=S.challengeDone&&S.daily.day===new Date().toDateString();return `<div class="page"><div class="topline"><div><div class="eyebrow">A FRESH BRIEF · ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div><h1 class="page-title">Daily design challenge</h1><p class="page-lede">A small creative constraint can open up a whole new direction.</p></div><button class="btn" data-screen="house">← My House</button></div><div class="columns"><section class="panel">${briefBlock({name:'Scandinavian Living Room',style:'Scandinavian',brief:'Create a light, welcoming Nordic living room. Place at least five pieces, include two natural wood elements and keep within the $2,600 recommended budget.',needs:['Sofa','Coffee Table','Lighting','Rug','Decoration'],budget:2600})}<div class="hub-stats"><div class="hub-stat"><label>BASE REWARD</label><b>$1,000</b></div><div class="hub-stat"><label>90+ SCORE</label><b>+$500</b></div><div class="hub-stat"><label>PERFECT SCORE</label><b>+$1,000</b></div><div class="hub-stat"><label>ALSO EARN</label><b>XP + REP</b></div></div><button class="btn primary" data-action="startChallenge" ${complete?'disabled':''}>${complete?'Completed today':'Start today’s design →'}</button></section><aside class="panel"><h2 class="section-title">Your design note</h2><p class="page-lede" style="font-size:10px;margin-top:10px">Score is based on fit, style, color, space, comfort and thoughtful spending. Premium pieces can help tell a story, but a coherent room can be made at any budget.</p><div class="inline-note">Today's challenge progress: ${complete?'Complete · come back tomorrow for a new prompt.':'Not started yet.'}</div></aside></div></div>`}
function competitionScreen(){return `<div class="page"><div class="topline"><div><div class="eyebrow">OPEN SHOWCASE · ENTRY IS FREE</div><h1 class="page-title">Design competitions</h1><p class="page-lede">Create an entry around the theme, then see where your design lands among a field of fictional designers.</p></div><button class="btn" data-screen="house">← My House</button></div><div class="columns"><section class="panel"><div class="eyebrow">THIS WEEK'S THEME</div><h2 class="section-title" style="margin-top:7px">A Scandinavian Living Room</h2><p class="page-lede" style="font-size:10px;margin-top:7px">A thoughtful study in light, natural texture and calm composition. Your design will be compared against a varied field of independent entrants.</p><div class="contract-meta"><span>FIRST PLACE<b>$5,000 · 100 REP</b></span><span>SECOND PLACE<b>$3,000 · 60 REP</b></span><span>PARTICIPATE<b>$500 · 10 REP</b></span></div><button class="btn primary" data-action="startCompetition" ${S.competitionDone?'disabled':''}>${S.competitionDone?'Entry submitted':'Create competition entry →'}</button></section><aside class="panel"><h2 class="section-title">The judging room</h2><p class="page-lede" style="font-size:10px;margin-top:10px">Style and brief fit matter as much as individual furniture. Your final score is compared with a different group of designers each entry.</p><div class="inline-note">Competition status · ${S.competitionDone?'Entry submitted':'Accepting entries'}</div></aside></div></div>`}
function marketScreen(){let trend=S.market.trend,items=H.furniture.filter(f=>f.styles.includes(trend)||f.name.toLowerCase().includes(trend.toLowerCase()));return `<div class="page"><div class="topline"><div><div class="eyebrow">A CALM, READABLE MARKET</div><h1 class="page-title">Furniture market</h1><p class="page-lede">A rotating style trend brings modestly higher resale demand. Treat it as a nudge, not a speculative market.</p></div><button class="btn" data-screen="house">← My House</button></div><div class="columns"><section class="panel"><div class="eyebrow">TRENDING THIS WEEK</div><h2 class="section-title" style="margin-top:8px">${trend}</h2><p class="page-lede" style="font-size:10px;margin-top:8px">Matching pieces currently resell for 20% above their standard resale value.</p><div class="shop-grid" style="grid-template-columns:repeat(2,1fr);margin-top:17px">${items.slice(0,4).map(f=>`<article class="furniture-card"><div class="furniture-card-body"><h3>${f.name}</h3><p>Standard resale ${money(f.resale)}<br>Trending resale ${money(currentResale(f))}</p></div></article>`).join('')}</div></section><aside class="panel"><h2 class="section-title">Market rhythm</h2><p class="page-lede" style="font-size:10px;margin-top:9px">Style preferences shift every week of real time. Furniture remains yours; only the resale estimate changes with demand.</p><div class="inline-note">Following the trend is optional. Client briefs, room fit and the design itself still determine project success.</div></aside></div></div>`}
function portfolioScreen(){return `<div class="page"><div class="topline"><div><div class="eyebrow">YOUR BEST WORK · ${S.portfolio.length} DESIGNS</div><h1 class="page-title">Design portfolio</h1><p class="page-lede">A record of completed rooms, client collaborations and the choices you made along the way.</p></div><button class="btn" data-screen="house">← My House</button></div><div class="portfolio-grid">${S.portfolio.slice().reverse().map(p=>`<article class="portfolio-card"><div class="portfolio-thumb"></div><div class="tag">${p.kind} · ${p.style}</div><h3>${p.name}</h3><p>${p.stars} · ${p.score}/100<br>${p.client||'Personal home'} · Earned ${money(p.reward)}</p></article>`).join('')||'<div class="empty-state">Your portfolio is ready for its first finished design.</div>'}</div></div>`}
function achievementScreen(){let done=S.achievements;let a=[['First Home','Complete your first room.',()=>H.rooms.some(r=>S.rooms[r.id].completed)],['Five Star Designer','Create an 85+ design.',()=>S.portfolio.some(p=>p.score>=85)],['Bargain Hunter','Complete a room below half budget.',()=>S.portfolio.some(p=>p.spent<p.budget*.5)],['High End','Purchase a premium furniture item.',()=>H.furniture.some(f=>f.price>=1200&&H.ownCount(f.id)>0)],['Master Designer','Reach Design Level 10.',()=>S.level>=10],['Perfect Harmony','Achieve a perfect 100/100.',()=>S.portfolio.some(p=>p.score===100)],['Full House','Complete all eight rooms.',()=>H.rooms.every(r=>S.rooms[r.id].completed)],['Client Favorite','Achieve 100 client satisfaction.',()=>S.portfolio.some(p=>p.satisfaction===100)],['Market Expert','Sell a trending piece.',()=>done.includes('Market Expert')],['Competition Winner','Win a design competition.',()=>done.includes('Competition Winner')],['Design Portfolio','Complete ten contracts.',()=>S.contractsDone>=10]];return `<div class="page"><div class="topline"><div><div class="eyebrow">MILESTONES · ${a.filter(x=>x[2]()).length} / ${a.length}</div><h1 class="page-title">Achievements</h1><p class="page-lede">Small recognitions for the work behind a thoughtful home and growing studio.</p></div><button class="btn" data-screen="house">← My House</button></div><div class="achievements">${a.map(([n,d,fn])=>`<article class="achievement-card ${fn()?'done':''}"><div class="tag">${fn()?'✦ UNLOCKED':'STUDIO MILESTONE'}</div><b>${n}</b><p>${d}</p></article>`).join('')}</div></div>`}
function guideScreen(){return `<div class="page"><div class="topline"><div><div class="eyebrow">A FEW THOUGHTFUL NOTES</div><h1 class="page-title">How to play</h1><p class="page-lede">Build your home one considered decision at a time.</p></div><button class="btn" data-screen="home">← Main menu</button></div><div class="guide-grid">${[['01 · SELECT','Open a room and choose a piece from the inventory list. The shop adds furniture to your permanent collection.'],['02 · PLACE','Click within the floor area to place an owned item. Drag placed furniture to reposition it.'],['03 · REFINE','Select furniture to rotate with R, change its finish or remove it. Zoom with the wheel; middle-drag to pan.'],['04 · COMPOSE','Cover the room brief with compatible categories. Cohesion, function, color and layout shape your score.'],['05 · COMPLETE','Complete a house room to earn cash, XP and reputation, then open the next room.'],['06 · TAKE WORK','Client projects, daily design briefs and competitions give your studio new goals and income.']].map(a=>`<article class="guide-card"><b>${a[0]}</b><p>${a[1]}</p></article>`).join('')}</div><div class="inline-note">Keyboard: R rotates · Delete removes · Esc clears selection · Ctrl/Cmd+Z undo · Ctrl/Cmd+Y redo. Your game saves automatically in this browser. Use Save, Load and New Game in Settings to manage your local save.</div><button class="btn primary" style="margin-top:16px" data-screen="house">Go to your house →</button></div>`}
function settingsModal(){openModal(`<div class="eyebrow">YOUR LOCAL GAME</div><h2>Settings & save</h2><p>Progress is stored in this browser on this device. No account or server is required.</p><div class="modal-buttons" style="justify-content:flex-start"><button class="btn primary" data-modal="save">Save Game</button><button class="btn" data-modal="load">Load Game</button><button class="btn" data-modal="new">New Game</button></div><div class="inline-note">A new game replaces the current local save. Export/import and sound settings are not part of this edition.</div><div class="modal-buttons"><button class="btn" data-modal="close">Done</button></div>`)}
function render(){header();let root=$('app');let screen=S.view;root.innerHTML=screen==='home'?homeScreen():screen==='house'?houseScreen():screen==='editor'?editorScreen():screen==='shop'?shopScreen():screen==='contracts'?contractsScreen():screen==='inventory'?inventoryScreen():screen==='challenge'?challengeScreen():screen==='competition'?competitionScreen():screen==='market'?marketScreen():screen==='portfolio'?portfolioScreen():screen==='achievements'?achievementScreen():guideScreen();}
function openModal(html){$('modalRoot').innerHTML=`<div class="modal-shade"><section class="modal-box">${html}</section></div>`}
function closeModal(){ $('modalRoot').innerHTML=''; }
function historySnapshot(){return{items:JSON.stringify(H.getRoom().items),inventory:JSON.stringify(S.inventory)}}
function pushHistory(){S.undo.push(historySnapshot());if(S.undo.length>30)S.undo.shift();S.redo=[]}
function undo(which){let src=which==='undo'?S.undo:S.redo,dst=which==='undo'?S.redo:S.undo;if(!src.length)return H.notify('Nothing to '+which+' yet.');dst.push(historySnapshot());let snap=src.pop();H.getRoom().items=JSON.parse(snap.items);S.inventory=JSON.parse(snap.inventory);S.activeItem=null;H.save();render()}
function startRoom(id,mode='house',contractId=null){let r=H.rooms.find(x=>x.id===id);if(!r||(!S.rooms[id].unlocked&&mode!=='contract'))return H.notify('This room is still locked.');S.editingRoom=id;S.mode=mode;S.contract=contractId;S.catalogFilter='All pieces';S.selected=null;S.activeItem=null;S.undo=[];S.redo=[];S.zoom=1;S.panX=0;S.panY=0;setView('editor')}
function buy(id){let f=H.furniture.find(a=>a.id===id);if(!f)return;if(f.level>S.level)return H.notify(`Reach Design Level ${f.level} to unlock ${f.name}.`);if(S.cash<f.price)return H.notify('Not enough cash. Finish a room or take a client brief.');S.cash-=f.price;S.inventory[id]=(S.inventory[id]||0)+1;H.save();H.notify(`${f.name} added to your inventory.`);render()}
function sellInventory(id){let f=H.furniture.find(a=>a.id===id);if(!f||!H.ownCount(id))return;let value=currentResale(f);openModal(`<button class="modal-close" data-modal="close">×</button><div class="eyebrow">INVENTORY SALE</div><h2>Sell one ${f.name}?</h2><p>Original price ${money(f.price)}. Current resale value ${money(value)}${value>f.resale?' includes the current trend bonus.':''}</p><div class="reward-box">You will receive ${money(value)}. This piece will be removed from your collection.</div><div class="modal-buttons"><button class="btn" data-modal="close">Keep piece</button><button class="btn primary" data-confirm-sell="${id}">Confirm sale</button></div>`)}
function removePlaced(){let i=S.activeItem;if(!Number.isInteger(i))return;pushHistory();let it=H.getRoom().items.splice(i,1)[0];S.inventory[it.fid]=(S.inventory[it.fid]||0)+1;S.activeItem=null;H.save();render();H.notify('Furniture returned to your inventory.')}
function completion(){let d=H.getRoom(),r=room(),c=S.mode==='contract'?H.contracts.find(x=>x.id===S.contract):null,result=H.score(d.items,r,c);if(!d.items.length)return H.notify('Place a few pieces before completing this design.');if(S.mode==='challenge'){let wood=d.items.filter(it=>{let f=H.furniture.find(x=>x.id===it.fid);return f&&/oak|walnut|wood|wooden|desk|table|nightstand|sideboard/i.test(f.name)}).length;if(d.items.length<5)result.total=Math.max(0,result.total-(5-d.items.length)*4);if(wood<2)result.total=Math.max(0,result.total-(2-wood)*5);result.stars=result.total<40?'★☆☆☆☆':result.total<55?'★★☆☆☆':result.total<70?'★★★☆☆':result.total<85?'★★★★☆':'★★★★★'}let reward=ownReward(result.total),perfect=bonusReward(result.total),repGain=result.total>=85?18:result.total>=70?12:result.total>=55?7:3,xp=140+result.total*2;
if(S.mode==='contract'){let sat=result.satisfaction;reward=Math.round(c.pay*(.7+.6*sat/100)+(sat>=80?c.bonus:0));perfect=0;repGain=Math.max(3,Math.round(c.rep*sat/100));xp=180+result.total*2}else if(S.mode==='challenge'){reward=1000+(result.total>=90?500:0)+(result.total===100?1000:0);perfect=0;repGain=12;xp=220}else if(S.mode==='competition'){reward=500;perfect=0;repGain=10;xp=150}else if(d.completed){reward=0;perfect=0;repGain=0;xp=0}
openModal(`<button class="modal-close" data-modal="close">×</button><div class="eyebrow">${S.mode==='contract'?'CLIENT REVIEW':S.mode==='challenge'?'DAILY DESIGN REVIEW':S.mode==='competition'?'COMPETITION ENTRY':'ROOM EVALUATION'}</div><h2>${S.mode==='contract'?'A room for '+c.client:S.mode==='challenge'?'Your daily design':S.mode==='competition'?'The judges are ready':`A thoughtful ${r.name.toLowerCase()}`}</h2><div style="display:flex;gap:17px;align-items:center"><div class="score-big">${result.total}<small style="font:14px 'DM Sans';color:#8c8e84"> / 100</small></div><div><div class="stars" style="font-size:19px">${result.stars}</div><span class="tag">${result.total>=85?'EXCEPTIONAL COMPOSITION':result.total>=70?'A WELL-RESOLVED ROOM':'A PROMISING FIRST DRAFT'}</span></div></div><div class="score-grid">${[['Style',result.style],['Color',result.color],['Function',result.func],['Comfort',result.comfort],['Quality',result.quality],['Composition',result.composition]].map(([a,b])=>`<div class="score-row"><span>${a}</span><b>${b}</b></div>`).join('')}</div><div class="inline-note">${result.requirements>=80?'The brief is well covered.':`Brief coverage ${result.requirements}%. Add missing functional pieces for a stronger match.`} Design value comes from thoughtful fit and placement, not the price tag.</div><div class="reward-box">${S.mode==='contract'?`Client satisfaction ${result.satisfaction}/100 · Client payment ${money(reward)}${result.satisfaction>=80?' including brief bonus':''}`:S.mode==='challenge'?`Challenge reward ${money(reward)}`:S.mode==='competition'?'Participation reward $500 · final rank will be shown after submission.':`Room reward ${money(reward)}${perfect?` · score bonus ${money(perfect)}`:''}`}<br>+${xp} XP · +${repGain} reputation · Approx. furniture spend ${money(result.spent)}</div><div class="modal-buttons"><button class="btn" data-modal="close">Continue editing</button><button class="btn primary" data-action="acceptCompletion">Accept design</button></div>`);S.pendingResult={result,reward,perfect,repGain,xp,c,mode:S.mode};}
function ownReward(n){return n<60?250:n<70?400:n<80?600:n<90?900:n<95?1300:n<100?1700:2500}function bonusReward(n){return n>=100?1000:n>=95?600:n>=90?300:0}
function acceptCompletion(){let p=S.pendingResult;if(!p)return;let {result,reward,perfect,repGain,xp,c,mode}=p;let paid=reward+perfect;S.cash+=paid;H.addXP(xp);S.rep=Math.min(100,S.rep+repGain);let r=room(),d=H.getRoom();let entry={name:c?.project||(mode==='challenge'?'Scandinavian Living Room':mode==='competition'?'Scandinavian Living Room':r.name),score:result.total,stars:result.stars,style:c?.style||r.style,reward:paid,spent:result.spent,budget:c?.budget||r.budget,satisfaction:result.satisfaction,client:c?.client||null,kind:mode==='contract'?'CLIENT PROJECT':mode==='challenge'?'DAILY CHALLENGE':mode==='competition'?'COMPETITION':'MY HOME',items:JSON.parse(JSON.stringify(d.items))};
if(mode==='house'){let was=d.completed;d.completed=true;d.score=result.total;d.earned=(d.earned||0)+(!was?paid:0);let idx=H.rooms.findIndex(x=>x.id===r.id);if(idx<H.rooms.length-1)S.rooms[H.rooms[idx+1].id].unlocked=true;if(!was)unlockAchievements(result)}
if(mode==='contract'){S.contractsDone++;if(result.satisfaction<38)S.rep=Math.max(0,S.rep-2);unlockAchievements(result)}
if(mode==='challenge'){S.challengeDone=true;S.daily.claimed=true}
if(mode==='competition'){let rival=Math.round(73+Math.random()*24);let pos=result.total>rival?1:result.total>=rival-4?2:result.total>=rival-9?3:4;let prize=pos===1?5000:pos===2?3000:pos===3?2000:500;let rg=pos===1?100:pos===2?60:pos===3?40:10;S.cash+=prize-500;S.rep=Math.min(100,S.rep+rg-10);entry.reward+=prize-500;entry.kind=`COMPETITION · PLACE ${pos}`;entry.score=result.total;if(pos===1)S.achievements.push('Competition Winner');S.achievements=[...new Set(S.achievements)];openModal(`<div class="eyebrow">SCANDINAVIAN LIVING ROOM · RESULTS</div><h2>${pos===1?'First place':pos===2?'A strong second place':pos===3?'A place on the podium':'A considered first entry'}</h2><p>Your design scored ${result.total}. This field's winning entry scored ${rival}.</p><div class="reward-box">${pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':'✦'} ${pos===1?'1st':pos===2?'2nd':pos===3?'3rd':'Participation'} · +${money(prize)} · +${rg} reputation · +${xp} XP</div><button class="btn primary" data-modal="finalize">Return to studio</button>`);S.competitionDone=true;S.competitionWeek=Math.floor(Date.now()/604800000);S.competitionResult=pos}
S.portfolio.push(entry);if(mode!=='competition'){closeModal();openModal(`<div class="eyebrow">DESIGN ACCEPTED</div><h2>${mode==='contract'?'Your client is delighted':mode==='challenge'?'Challenge complete':`A room to be proud of`}</h2><p>${mode==='contract'?`Client satisfaction: ${result.satisfaction}/100. A new relationship for your growing studio.`:mode==='challenge'?"Today's brief is complete. A new prompt will be ready tomorrow.":'Your home has taken another step toward feeling like yours.'}</p><div class="reward-box">+${money(paid)} · +${xp} XP · +${repGain} reputation</div><div class="modal-buttons"><button class="btn" data-modal="finalize">View portfolio</button><button class="btn primary" data-modal="house">Return to my house</button></div>`)}
H.save();render();}
function unlockAchievements(result){if(S.portfolio.length===0){}if(result.total>=85)S.achievements.push('Five Star Designer');if(result.total===100)S.achievements.push('Perfect Harmony');if(result.spent<result.budget*.5)S.achievements.push('Bargain Hunter');if(S.contractsDone>=10)S.achievements.push('Design Portfolio');S.achievements=[...new Set(S.achievements)]}
function startChallenge(){if(S.daily.day!==new Date().toDateString()){S.daily={day:new Date().toDateString(),claimed:false};S.challengeDone=false}if(S.challengeDone)return H.notify('You have already completed today’s brief.');S.mode='challenge';startRoom('living','challenge')}
function startCompetition(){if(S.competitionDone)return H.notify('Your entry has already been submitted for this week.');S.mode='competition';startRoom('living','competition')}
function acceptContract(id){let c=H.contracts.find(x=>x.id===id);if(!c)return;if(S.rep<(c.repReq||0))return H.notify('Your studio needs more reputation for this brief.');S.contract=id;S.clientDrafts[id]={items:[]};S.mode='contract';startRoom(c.room,'contract',id)}
function confirmSell(id){let f=H.furniture.find(x=>x.id===id);if(!f||!H.ownCount(id))return;S.inventory[id]--;if(S.inventory[id]<=0)delete S.inventory[id];let val=currentResale(f);S.cash+=val;if(f.styles.includes(S.market.trend))S.achievements.push('Market Expert');S.achievements=[...new Set(S.achievements)];closeModal();H.save();render();H.notify(`${f.name} sold for ${money(val)}.`)}
function setPlacedColor(color){let it=H.getRoom().items[S.activeItem];if(it){it.color=color;H.save();render()}}
function hangSelected(){let f=H.furniture.find(x=>x.id===S.selected);if(!f||!['art','mirror','curtains','tv'].includes(f.type))return H.notify('Select a wall decoration first.');if(!H.ownCount(f.id))return H.notify('This piece is no longer in your inventory.');pushHistory();let wallItems=H.getRoom().items.filter(it=>it.surface==='wall').length;let positions=[[66,31],[25,30],[78,47],[30,48],[67,18]];let [x,y]=positions[wallItems%positions.length];H.getRoom().items.push({fid:f.id,x,y,rot:0,color:f.color,surface:'wall',w:f.type==='tv'?76:67,h:f.type==='curtains'?88:65});S.inventory[f.id]--;if(!S.inventory[f.id])delete S.inventory[f.id];S.activeItem=H.getRoom().items.length-1;S.selected=null;H.save();render();H.notify(`${f.name} hung on the wall. Drag it to adjust its position.`)}
function action(name){if(name==='complete')return completion();if(name==='rotate'){let it=H.getRoom().items[S.activeItem];if(it){pushHistory();it.rot=((it.rot||0)+45)%360;H.save();render()}return}if(name==='remove')return removePlaced();if(name==='hang')return hangSelected();if(name==='acceptCompletion')return acceptCompletion();if(name==='startChallenge')return startChallenge();if(name==='startCompetition')return startCompetition();if(name==='claimDaily'){if(S.daily.rewardClaimed)return H.notify('Your daily gift has already been collected.');S.cash+=350;H.addXP(80);S.daily.rewardClaimed=true;H.save();render();H.notify('Daily gift collected · $350 and 80 XP.');return}}
function clickHandler(e){let t=e.target.closest('[data-screen],[data-enter],[data-action],[data-select-furniture],[data-filter],[data-undo],[data-buy],[data-accept],[data-sell],[data-modal],[data-confirm-sell],[data-confirm-contract],[data-color],[data-wall-color],[data-placed],[data-zoom]');if(!t)return;
if(t.dataset.screen){if(t.dataset.screen==='shop'&&S.view==='editor')S.showShopFrom='editor';if(t.dataset.screen==='editor')return setView('editor');return setView(t.dataset.screen)}
if(t.dataset.enter){startRoom(t.dataset.enter);return}
if(t.dataset.action){action(t.dataset.action);return}
if(t.dataset.selectFurniture){S.selected=t.dataset.selectFurniture;S.activeItem=null;render();return}
if(t.dataset.filter){S.catalogFilter=t.dataset.filter;render();return}
if(t.dataset.undo){undo(t.dataset.undo);return}
if(t.dataset.buy){buy(t.dataset.buy);return}
if(t.dataset.accept){openModal(`<button class="modal-close" data-modal="close">×</button><div class="eyebrow">CONTRACT REVIEW · ${H.contracts.find(c=>c.id===t.dataset.accept).tier}</div><h2>Take on ${H.contracts.find(c=>c.id===t.dataset.accept).project}?</h2><p>You can use compatible furniture already in your inventory and buy any additional pieces. The client pays according to the result and budget fit.</p><div class="modal-buttons"><button class="btn" data-modal="close">Review other briefs</button><button class="btn primary" data-confirm-contract="${t.dataset.accept}">Accept this brief →</button></div>`);return}
if(t.dataset.sell){sellInventory(t.dataset.sell);return}
if(t.dataset.modal==='close'){closeModal();return}if(t.dataset.modal==='save'){H.save();H.notify('Game saved in this browser.');return}if(t.dataset.modal==='load'){S=H.load();H.state=S;closeModal();render();H.notify('Saved game loaded.');return}if(t.dataset.modal==='new'){openModal(`<div class="eyebrow">START OVER</div><h2>Begin a new design story?</h2><p>This replaces your existing local game and clears its rooms, cash and inventory.</p><div class="modal-buttons"><button class="btn" data-modal="close">Keep playing</button><button class="btn danger" data-modal="confirmNew">Start a new game</button></div>`);return}if(t.dataset.modal==='confirmNew'){H.state=H.freshState();Object.assign(S,H.state);H.state=S;H.save();closeModal();setView('home');H.notify('A new design story begins.');return}if(t.dataset.modal==='house'||t.dataset.modal==='finalize'){closeModal();S.mode='house';S.contract=null;setView(t.dataset.modal==='finalize'?'portfolio':'house');return}
if(t.dataset.confirmContract){closeModal();acceptContract(t.dataset.confirmContract);return}if(t.dataset.confirmSell){confirmSell(t.dataset.confirmSell);return}
if(t.dataset.color){setPlacedColor(t.dataset.color);return}if(t.dataset.wallColor){let d=H.getRoom();d.wallColor=t.dataset.wallColor;H.save();render();H.notify('Wall finish updated.');return}if(t.dataset.placed!==undefined){S.activeItem=Number(t.dataset.placed);S.selected=null;render();return}
if(t.dataset.zoom){S.zoom=Math.max(.75,Math.min(1.4,(S.zoom||1)+Number(t.dataset.zoom)*.12));render();return}
}
document.addEventListener('click',clickHandler);
document.addEventListener('click',e=>{if(e.target.id==='settingsBtn')settingsModal();if(e.target.id==='shopFilter'){S.shopFilter=e.target.value}if(e.target.id==='shopSort'){S.sort=e.target.value}if(e.target.id==='invFilter'){S.invFilter=e.target.value}});
// Preserve current shop filters on rerender; native select's change event updates the view.
document.addEventListener('change',e=>{if(e.target.id==='shopFilter'){S.shopFilter=e.target.value;render();$('shopFilter').value=S.shopFilter}if(e.target.id==='shopSort'){S.sort=e.target.value;render();$('shopSort').value=S.sort}if(e.target.id==='invFilter'){S.invFilter=e.target.value;render();$('invFilter').value=S.invFilter}});
let drag=null,pan=null;
document.addEventListener('pointerdown',e=>{let placed=e.target.closest('[data-placed]'),canvas=$('roomCanvas');if(!canvas)return;if(e.button===1){pan={x:e.clientX,y:e.clientY,px:S.panX||0,py:S.panY||0};e.preventDefault();return}if(placed){let i=Number(placed.dataset.placed);S.activeItem=i;S.selected=null;pushHistory();drag={index:i,sx:e.clientX,sy:e.clientY,ox:H.getRoom().items[i].x,oy:H.getRoom().items[i].y,moved:false};placed.setPointerCapture?.(e.pointerId);e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(drag){let canvas=$('roomCanvas'),r=canvas.getBoundingClientRect(),dx=(e.clientX-drag.sx)/r.width*100,dy=(e.clientY-drag.sy)/r.height*100;if(Math.abs(dx)+Math.abs(dy)>1)drag.moved=true;if(drag.moved){let it=H.getRoom().items[drag.index],onWall=it.surface==='wall';let x=Math.min(onWall?92:88,Math.max(onWall?8:12,drag.ox+dx)),y=onWall?Math.min(58,Math.max(8,drag.oy+dy)):Math.min(94,Math.max(60,drag.oy+dy));const align=(v,anchors)=>{let near=anchors.reduce((best,a)=>Math.abs(a-v)<Math.abs(best-v)?a:best,v);return Math.abs(near-v)<1.1?near:v};let peers=H.getRoom().items.filter((p,i)=>i!==drag.index&&(p.surface==='wall')===onWall);it.x=align(x,[50,35,65,...peers.map(p=>p.x)]);it.y=align(y,onWall?[18,30,45,...peers.map(p=>p.y)]:[69,80,91,...peers.map(p=>p.y)]);let el=document.querySelector(`[data-placed="${drag.index}"]`);if(el){el.style.setProperty('--x',it.x+'%');el.style.setProperty('--y',it.y+'%');el.style.zIndex=Math.round(it.y)}}}if(pan){S.panX=pan.px+e.clientX-pan.x;S.panY=pan.py+e.clientY-pan.y;let c=$('roomCanvas');if(c)c.style.transform=`translate(${S.panX}px,${S.panY}px) scale(${S.zoom||1})`}});
document.addEventListener('pointerup',()=>{if(drag){if(drag.moved){let arr=H.getRoom().items;let moved=arr.splice(drag.index,1)[0];arr.push(moved);S.activeItem=arr.length-1;H.save();render()}else{S.undo.pop();S.activeItem=drag.index;render()}drag=null}if(pan){pan=null;H.save()}});
document.addEventListener('click',e=>{let c=e.target.closest('#roomCanvas');if(!c||e.target.closest('.placed')||S.view!=='editor'||!S.selected)return;let f=H.furniture.find(x=>x.id===S.selected);if(!f)return;if(!H.ownCount(f.id))return H.notify('This piece is no longer in your inventory.');let rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;let wallTypes=['art','mirror','curtains','tv'].includes(f.type);if(wallTypes){if(y<4||y>72||x<5||x>95)return H.notify('Click anywhere on the visible wall area to hang this piece.')}else if(y<61||y>99||x<8||x>92)return H.notify('Place furniture on the visible floor.');pushHistory();let sizeMap={sofa:[120,76],chair:[62,72],coffee:[83,52],console:[100,55],tv:[76,65],bookcase:[74,99],lamp:[52,79],pendant:[49,70],rug:[130,68],plant:[58,86],art:[67,65],curtains:[70,88],dining:[125,83],diningchair:[57,63],counter:[135,73],fridge:[62,94],cooker:[65,82],island:[120,72],bed:[137,90],nightstand:[62,59],wardrobe:[82,104],dresser:[85,70],bench:[83,56],bath:[125,69],shower:[95,100],vanity:[98,67],sink:[68,67],toilet:[59,64],mirror:[60,67],towelrack:[57,72],desk:[98,65],officechair:[62,72],cabinet:[70,81],sideboard:[110,65],chandelier:[62,68],outdoorsofa:[125,78],outtable:[94,68],lounger:[93,62],umbrella:[87,92],planters:[62,72],outlamp:[50,74],firepit:[78,65]};H.getRoom().items.push({fid:f.id,x,y,rot:0,color:f.color,surface:wallTypes?'wall':'floor',w:sizeMap[f.type]?.[0]||70,h:sizeMap[f.type]?.[1]||62});S.inventory[f.id]--;if(!S.inventory[f.id])delete S.inventory[f.id];S.activeItem=H.getRoom().items.length-1;S.selected=null;H.save();render();H.notify(wallTypes?`${f.name} hung on the wall.`:`${f.name} placed in your room.`)});
document.addEventListener('wheel',e=>{let c=e.target.closest('#roomStage');if(!c)return;e.preventDefault();S.zoom=Math.max(.75,Math.min(1.4,(S.zoom||1)+(e.deltaY<0?.06:-.06)));let canvas=$('roomCanvas');if(canvas)canvas.style.transform=`translate(${S.panX||0}px,${S.panY||0}px) scale(${S.zoom})`},{passive:false});
document.addEventListener('auxclick',e=>{if(e.button===1)e.preventDefault()});
document.addEventListener('keydown',e=>{if(S.view!=='editor')return;let mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();undo('undo')}else if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();undo('redo')}else if(e.key.toLowerCase()==='r'){action('rotate')}else if(e.key==='Delete'||e.key==='Backspace'){removePlaced()}else if(e.key==='Escape'){S.selected=null;S.activeItem=null;render()}});
window.addEventListener('beforeunload',H.save);
render();
})();
